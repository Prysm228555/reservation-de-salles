
services:

  # Application Symfony / PHP-FPM
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor

    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}

      DATABASE_URL: "mysql://${MYSQL_USER:-reservation_user}:${MYSQL_PASSWORD:-reservation_password}@database:3306/${MYSQL_DATABASE:-reservation_salles}?serverVersion=8.4.0&charset=utf8mb4"

    depends_on:
      database:
        condition: service_healthy

  # Serveur Web
  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      php:
        condition: service_started

  # Base de données
  database:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reservation_salles}
      MYSQL_USER: ${MYSQL_USER:-reservation_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reservation_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_dev}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  vendor_data:
